name: Build Windows Installer

# Когда запускать сборку:
on:
  # 1. Вручную через кнопку "Run workflow" во вкладке Actions
  workflow_dispatch:

  # 2. Автоматически при создании тега вида v0.1.0, v1.0.0 и т.д.
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ----- Подготовка -----
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Show Python version
        run: python --version

      # ----- Зависимости -----
      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller==6.8.0

      # ----- Сборка .exe -----
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean build.spec

      - name: Verify build output
        run: |
          if (-Not (Test-Path "dist/FaceSwapStudio/FaceSwapStudio.exe")) {
            Write-Error "Build failed: FaceSwapStudio.exe not found"
            exit 1
          }
          Write-Host "Build OK"
          Get-ChildItem dist/FaceSwapStudio | Select-Object -First 10

      # ----- Inno Setup для инсталлятора -----
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Verify installer
        run: |
          if (-Not (Test-Path "Output/FaceSwapStudio_Setup.exe")) {
            Write-Error "Installer not created"
            exit 1
          }
          $size = (Get-Item "Output/FaceSwapStudio_Setup.exe").Length / 1MB
          Write-Host "Installer size: $([math]::Round($size, 1)) MB"

      # ----- Загрузка артефактов -----
      # Артефакт всегда доступен после прогона workflow (90 дней хранится)
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapStudio-Installer
          path: Output/FaceSwapStudio_Setup.exe
          retention-days: 90

      - name: Upload portable build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapStudio-Portable
          path: dist/FaceSwapStudio/
          retention-days: 30

      # ----- Создание Release (только при push тега) -----
      # Если ты пушнёшь тег v0.1.0 — автоматически создастся релиз
      # с прикреплённым инсталлятором
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/FaceSwapStudio_Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
